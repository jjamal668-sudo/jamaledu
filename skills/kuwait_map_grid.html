<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموقع الفلكي لدولة الكويت — خطوط الطول ودوائر العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430; --sub:#4A5A6E; --lon:#E67E22; --lat:#00A9A5; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;font-family:'Tajawal',sans-serif;background:#12232E;color:var(--ink);overflow:hidden;}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  header{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.2);z-index:5;flex-wrap:wrap;gap:8px;}
  header h1{font-family:'Cairo',Tajawal,sans-serif;font-weight:800;font-size:1.15rem;color:#fff;margin:0;}
  header p{font-size:.78rem;color:rgba(255,255,255,.65);margin:.2rem 0 0;}
  .legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.72rem;color:#fff;}
  .legend span{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:100px;}
  .legend i{width:16px;height:3px;border-radius:2px;display:inline-block;}

  .map-area{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;}
  .map-frame{position:relative;max-width:100%;}
  .map-frame img{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 20px 50px -15px rgba(0,0,0,.6);}
  svg.overlay{position:absolute;inset:0;width:100%;height:100%;}

  .gline{cursor:pointer;}
  .gline .hit{fill:none;pointer-events:stroke;}
  .gline .vis{fill:none;transition:stroke-width .15s ease, filter .15s ease;}
  .gline:hover .vis{filter:brightness(1.2);}
  .gline.active .vis{stroke-width:4.5;}

  .glabel{font-family:'Cairo',Tajawal,sans-serif;font-weight:800;font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none;direction:ltr;unicode-bidi:bidi-override;}
  .glabel.lon{fill:var(--lon);}
  .glabel.lat{fill:var(--lat);}

  .infocard{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%) translateY(130%);
    background:#fff; border-radius:18px; padding:16px 20px; max-width:380px; width:88%;
    box-shadow:0 20px 50px -15px rgba(0,0,0,.5); transition:transform .35s cubic-bezier(.25,.8,.3,1);
    z-index:20; text-align:right;
  }
  .infocard.show{transform:translateX(-50%) translateY(0);}
  .infocard .cat{font-size:.7rem;font-weight:700;margin-bottom:3px;}
  .infocard.lon .cat{color:var(--lon);}
  .infocard.lat .cat{color:var(--lat);}
  .infocard h3{font-family:'Cairo',Tajawal,sans-serif;font-weight:800;font-size:1.15rem;margin:0 0 5px;color:var(--ink);}
  .infocard p{font-size:.85rem;color:var(--sub);line-height:1.55;margin:0;}
  .infocard .close{position:absolute;top:10px;left:12px;background:none;border:none;font-size:1.1rem;color:#aaa;cursor:pointer;}
  .source-note{position:fixed;bottom:8px;right:14px;color:rgba(255,255,255,.35);font-size:.65rem;z-index:2;}
</style>

<style id="jm-skin">
/* jm-skin: صفحات الخرائط والمهارات بهوية المنصة (فاتح/ليلي) */
:root{ --jm-paper:#F4F2EC; --jm-card:#fff; --jm-ink:#101B33; --jm-mut:#56627A; --jm-blue:#3355D6; --jm-gold:#F5B72E; --jm-edge:rgba(16,27,51,.13); --jm-edge2:rgba(16,27,51,.22); --bg:#F4F2EC; }
html[data-theme="dark"]{ --jm-paper:#080D1C; --jm-card:#141F39; --jm-ink:#EEF2FA; --jm-mut:#9AA8C6; --jm-blue:#6B8FFF; --jm-gold:#F8C957; --jm-edge:rgba(255,255,255,.14); --jm-edge2:rgba(255,255,255,.22); --bg:#080D1C; }
html,body{ background:var(--jm-paper) !important; color:var(--jm-ink) !important; }
body{ background:radial-gradient(rgba(16,27,51,.07) 1.2px,transparent 1.3px) 0 0/24px 24px, radial-gradient(760px 520px at 92% -6%, rgba(245,183,46,.22), transparent 62%), radial-gradient(820px 640px at -8% 24%, rgba(51,85,214,.14), transparent 62%), var(--jm-paper) !important; background-attachment:scroll,fixed,fixed,scroll !important; }
html[data-theme="dark"] body{ background:radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.3px) 0 0/24px 24px, radial-gradient(760px 520px at 92% -6%, rgba(255,170,90,.20), transparent 62%), radial-gradient(820px 640px at -8% 22%, rgba(110,130,255,.26), transparent 62%), radial-gradient(800px 600px at 10% 96%, rgba(168,100,255,.16), transparent 64%), linear-gradient(180deg,#080D1C,#0C1130 48%,#110E2B) !important; background-attachment:scroll,fixed,fixed,fixed,fixed !important; }
header{ background:transparent !important; }
header h1{ color:var(--jm-ink) !important; font-family:'Cairo',Tajawal,sans-serif !important; }
header p{ color:var(--jm-mut) !important; }
.back{ color:var(--jm-ink) !important; border:1.5px solid var(--jm-edge2) !important; background:var(--jm-card) !important; font-weight:800; }
.back:hover{ border-color:var(--jm-blue) !important; }
.tab{ border:1.5px solid var(--jm-edge2) !important; background:var(--jm-card) !important; color:var(--jm-mut) !important; }
.tab.on{ background:var(--jm-gold) !important; border-color:var(--jm-gold) !important; color:#101B33 !important; box-shadow:0 10px 20px -10px rgba(245,183,46,.9); }
.question-banner{ background:color-mix(in srgb,var(--jm-gold) 16%,var(--jm-card)) !important; border:1.5px solid color-mix(in srgb,var(--jm-gold) 55%,transparent) !important; }
.question-banner p{ color:var(--jm-ink) !important; }
.question-banner b{ color:var(--jm-ink) !important; background:color-mix(in srgb,var(--jm-gold) 40%,transparent); padding:0 .25em; border-radius:6px; }
.card,.ecard{ border:1.5px solid var(--jm-edge) !important; box-shadow:0 18px 38px -22px rgba(16,27,51,.34) !important; }
html[data-theme="dark"] .card,html[data-theme="dark"] .ecard{ background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.035)), #101A33 !important; color:var(--jm-ink) !important; }
html[data-theme="dark"] .card h3,html[data-theme="dark"] .card p,html[data-theme="dark"] .ecard .ename,html[data-theme="dark"] .ecard .edate{ color:var(--jm-ink) !important; }
.jm-tg{ position:fixed; z-index:50; bottom:14px; inset-inline-start:14px; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--jm-edge2); background:var(--jm-card); color:var(--jm-ink); font-size:1.15rem; cursor:pointer; display:grid; place-items:center; box-shadow:0 10px 24px -10px rgba(16,27,51,.5); }
h1,h2,h3{ font-family:'Cairo',Tajawal,sans-serif; }
.legend,.legend .litem,.legend-list,.source-note,.hint-bottom,.progress-hint,.note,.qtop{ color:var(--jm-mut) !important; }
.reset-btn,.btn.reset{ color:var(--jm-ink) !important; border:1.5px solid var(--jm-edge2) !important; background:var(--jm-card) !important; }
.reset-btn:hover,.btn.reset:hover{ border-color:var(--jm-blue) !important; color:var(--jm-ink) !important; }
.ph,.placeholder{ color:#56627A !important; }
button.close,.close{ color:#56627A !important; }
.ruler-photo{ color:#56627A !important; }
.chevron{ color:#8F6B0E !important; }
html[data-theme="dark"] .chevron{ color:#8F6B0E !important; }

</style>

document.addEventListener("DOMContentLoaded",function(){var b=document.createElement("button");b.className="jm-tg";b.type="button";b.setAttribute("aria-label","تبديل الوضع الليلي");function sync(){b.textContent=r.getAttribute("data-theme")==="dark"?"☀️":"🌙";}sync();b.onclick=function(){var d=r.getAttribute("data-theme")!=="dark";if(d){r.setAttribute("data-theme","dark");}else{r.removeAttribute("data-theme");}try{localStorage.setItem("jamalTheme",d?"dark":"light");}catch(e){}sync();};document.body.appendChild(b);});})();</script>

  function showInfo(key, el){
    const d = DATA[key];
    if(!d) return;
    document.querySelectorAll('.gline').forEach(g=>g.classList.remove('active'));
    el.classList.add('active');
    const card = document.getElementById('infocard');
    card.classList.remove('lon','lat');
    card.classList.add(d.kind);
    document.getElementById('ic-cat').textContent = d.kind === 'lon' ? 'خط طول' : 'دائرة عرض';
    document.getElementById('ic-title').textContent = d.title;
    document.getElementById('ic-body').textContent = d.body;
    card.classList.add('show');
  }
  function closeInfo(){
    document.getElementById('infocard').classList.remove('show');
    document.querySelectorAll('.gline').forEach(g=>g.classList.remove('active'));
  }
